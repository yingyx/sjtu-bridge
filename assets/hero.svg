<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">SJTU Bridge</title>
  <desc id="description">One bridge to SJTU, for humans and agents. 一处部署，多端共用：一份本机 Bridge，连接应用与 Agent。任务导航，直达能力：按校园任务检索，直接调用已接入能力。凭据托管，最小授权：上游凭据留在 Broker，应用按需获权、独立撤销。</desc>
