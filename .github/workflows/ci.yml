name: Go checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        shell: bash
        run: test -z "$(gofmt -l bridge client cmd contracts internal)"
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build Windows with retained symbols
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Build Unix
        if: runner.os != 'Windows'
        run: go build ./cmd/sjtu
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
